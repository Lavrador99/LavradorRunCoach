name: RunCoach5km

options:
  bundleIdPrefix: com.alexandrelavrador
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RunCoach5km:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RunCoach5km
        excludes:
          - "**/*.entitlements"
    info:
      path: RunCoach5km/Info.plist
      properties:
        CFBundleDisplayName: RunCoach 5km
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "A app usa HealthKit para gerir os teus treinos"
        NSHealthUpdateUsageDescription: "A app usa HealthKit para enviar treinos para o Apple Watch"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.alexandrelavrador.RunCoach5km
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: RunCoach5km/RunCoach5km.entitlements
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WorkoutKit.framework
